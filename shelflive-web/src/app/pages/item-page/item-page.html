<div class="d-flex">
    <app-sidebar-component></app-sidebar-component>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Ítems de los usuarios</h1>
            <button type="button" class="btn btn-primary" (click)="openItemModal()">Añadir ítem</button>
        </div>

        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th>Precio pagado</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (i of items(); track i.id) {
                <tr>
                    <td>{{ i.product }}</td>
                    <td>{{ i.user }}</td>
                    <td>{{ i.state }}</td>
                    <td>{{ i.price }} €</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-primary me-2" (click)="openItemModal(i)">Editar</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" (click)="openDeleteModal(i)">Eliminar</button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="5" class="text-center text-secondary">No hay ítems.</td>
                </tr>
                }
            </tbody>
        </table>
    </main>
</div>
