<div class="d-flex">
    <app-sidebar-component></app-sidebar-component>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Gestión de usuarios</h1>
            <button type="button" class="btn btn-primary" (click)="openUserModal()">Añadir usuario</button>
        </div>

        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (u of users(); track u.id) {
                <tr>
                    <td>{{ u.name }}</td>
                    <td>{{ u.email }}</td>
                    <td>{{ u.role }}</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-primary me-2" (click)="openUserModal(u)">Editar</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" (click)="openDeleteModal(u)">Eliminar</button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="4" class="text-center text-secondary">No hay usuarios.</td>
                </tr>
                }
            </tbody>
        </table>
    </main>
</div>
