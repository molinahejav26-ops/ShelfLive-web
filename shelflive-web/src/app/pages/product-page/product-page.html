<div class="d-flex">
    <app-sidebar-component></app-sidebar-component>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Gestión del catálogo</h1>
            <button type="button" class="btn btn-primary" (click)="openProductModal()">Añadir producto</button>
        </div>

        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>Código de barras</th>
                    <th>Título</th>
                    <th>Plataforma</th>
                    <th>Categoría</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (p of products(); track p.id) {
                <tr>
                    <td>{{ p.barcode }}</td>
                    <td>{{ p.title }}</td>
                    <td>{{ p.platform || '—' }}</td>
                    <td>{{ p.category }}</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-primary me-2" (click)="openProductModal(p)">Editar</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" (click)="openDeleteModal(p)">Eliminar</button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="5" class="text-center text-secondary">No hay productos.</td>
                </tr>
                }
            </tbody>
        </table>
    </main>
</div>
