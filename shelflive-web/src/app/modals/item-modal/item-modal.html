<form [formGroup]="itemForm" (ngSubmit)="save()" novalidate>
    <div class="modal-header">
        <h4 class="modal-title">{{ editing ? 'Editar ítem' : 'Añadir ítem' }}</h4>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="activeModal.dismiss()"></button>
    </div>

    <div class="modal-body">
        <div class="mb-3">
            <label for="product" class="form-label">Producto</label>
            <input id="product" type="text" formControlName="product" class="form-control"
                [class.is-invalid]="isInvalidField('product')" />
            @if(isInvalidField('product')) {
            <div class="invalid-feedback">El producto es obligatorio</div>
            }
        </div>

        <div class="mb-3">
            <label for="user" class="form-label">Usuario</label>
            <input id="user" type="text" formControlName="user" class="form-control"
                [class.is-invalid]="isInvalidField('user')" />
            @if(isInvalidField('user')) {
            <div class="invalid-feedback">El usuario es obligatorio</div>
            }
        </div>

        <div class="mb-3">
            <label for="state" class="form-label">Estado</label>
            <select id="state" formControlName="state" class="form-select">
                <option value="Nuevo">Nuevo</option>
                <option value="Usado">Usado</option>
            </select>
        </div>

        <div>
            <label for="price" class="form-label">Precio pagado (€)</label>
            <input id="price" type="number" step="0.01" formControlName="price" class="form-control"
                [class.is-invalid]="isInvalidField('price')" />
            @if(isInvalidField('price')) {
            <div class="invalid-feedback">El precio es obligatorio y no puede ser negativo</div>
            }
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
