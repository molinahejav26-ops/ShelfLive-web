<div class="modal-header">
    <h4 class="modal-title">Eliminar</h4>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="no()"></button>
</div>
<div class="modal-body">
    <p class="mb-0">¿Seguro que quieres eliminar <strong>{{ name }}</strong>?</p>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="no()">No, cancelar</button>
    <button type="button" class="btn btn-danger" (click)="yes()">Sí, eliminar</button>
</div>
