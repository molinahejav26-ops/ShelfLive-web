<div class="modal-content">
    <div class="modal-header"><h2 class="modal-title">Eliminar registro</h2><button type="button" class="btn-close" aria-label="Cerrar" (click)="no()">×</button></div>
    <div class="modal-body"><p>¿Seguro que quieres eliminar <strong>{{ name }}</strong>? Esta acción no se puede deshacer.</p></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" (click)="no()">Cancelar</button><button type="button" class="btn btn-danger" (click)="yes()">Eliminar</button></div>
</div>
